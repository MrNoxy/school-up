<main class="app"><header class="topbar"><div class="title-wrap"><div class="brand"><span data-icon="book"></span>School Up</div><button class="title-button" id="schedule-switch" aria-haspopup="dialog" title="Switch or manage schedules"><h1 id="schedule-title">Schedule</h1><span data-icon="chevron-down"></span></button></div><button class="icon-button" id="settings-open" aria-label="Settings" title="Settings"><span data-icon="settings"></span></button></header><div class="controls"><div class="segmented" id="view-switch" role="group" aria-label="Schedule view"><button class="segment" data-view="list"><span data-icon="list"></span>Day</button><button class="segment" data-view="cards"><span data-icon="grid"></span>Cards</button><button class="segment" data-view="week"><span data-icon="calendar"></span>Week</button></div><button class="primary" id="add-subject"><span data-icon="plus"></span>Add subject</button></div><nav class="days" id="days" aria-label="Day of the week"></nav><section id="content" aria-label="Your timetable"></section><footer class="footnote"><span id="week-summary"></span><button class="text-button" id="today-button">Back to today</button></footer></main>
<dialog id="editor" aria-labelledby="editor-title"><div class="modal-header"><h2 id="editor-title">New subject</h2><button class="icon-button" data-close aria-label="Close"><span data-icon="x"></span></button></div><form class="modal-body" id="subject-form"><div class="field"><label for="subject-name">Subject</label><input id="subject-name" required maxlength="120" placeholder="e.g. Mathematics" autocomplete="off"></div><div class="field"><label for="subject-day">Day</label><select id="subject-day"></select></div><div class="row"><div class="field"><label for="subject-start">Starts</label><input id="subject-start" type="time" required></div><div class="field"><label for="subject-end">Ends</label><input id="subject-end" type="time" required></div></div><p class="error" id="subject-error" role="alert"></p><button class="primary full" type="submit">Save subject</button><button class="text-button danger full" type="button" id="delete-subject" style="margin-top:14px">Delete subject</button></form></dialog>
<dialog id="settings" aria-labelledby="settings-title"><div class="modal-header"><h2 id="settings-title">Settings</h2><button class="icon-button" data-close aria-label="Close settings"><span data-icon="x"></span></button></div><div class="segmented settings-tabs" role="tablist" aria-label="Settings sections"><button role="tab" class="segment active" data-tab="appearance" id="tab-appearance" aria-controls="settings-panel">Appearance</button><button role="tab" class="segment" data-tab="layout" id="tab-layout" aria-controls="settings-panel">Layout</button><button role="tab" class="segment" data-tab="exports" id="tab-exports" aria-controls="settings-panel">Files & exports</button></div><div class="modal-body" id="settings-panel" role="tabpanel"></div></dialog>
<dialog id="schedules" aria-labelledby="schedules-title"><div class="modal-header"><h2 id="schedules-title">Your schedules</h2><button class="icon-button" data-close aria-label="Close schedules"><span data-icon="x"></span></button></div><div class="modal-body"><div id="schedule-options"></div><button id="new-schedule" class="primary full"><span data-icon="plus"></span>New schedule</button><p class="hint">Each schedule has its own subjects. Switch whenever you like.</p></div></dialog>
<dialog id="name-dialog" aria-labelledby="name-title"><div class="modal-header"><h2 id="name-title">New schedule</h2><button class="icon-button" data-close aria-label="Close"><span data-icon="x"></span></button></div><form class="modal-body" id="name-form"><div class="field"><label for="schedule-name">Schedule name</label><input id="schedule-name" required maxlength="70" placeholder="e.g. Semester 2" autocomplete="off"></div><button class="primary full" type="submit">Save schedule</button></form></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><div class="modal-header"><h2 id="confirm-title"></h2><button class="icon-button" data-close aria-label="Cancel"><span data-icon="x"></span></button></div><div class="modal-body"><p class="muted" id="confirm-description"></p><div class="confirm-actions"><button class="secondary" data-close>Cancel</button><button class="primary" id="confirm-action">Continue</button></div></div></dialog>

const week=sheet(rows,`<col min="1" max="1" width="11" customWidth="1"/><col min="2" max="${ds.length+1}" width="25" customWidth="1"/>`,Math.max(4,slots.length+4),ds.length,`<mergeCells count="2"><mergeCell ref="A1:${col(ds.length)}1"/><mergeCell ref="A2:${col(ds.length)}2"/></mergeCells>`);
let dataRows=`<row r="1" ht="28" customHeight="1">${['Day','Subject','Start','End','Duration (min)'].map((v,i)=>stringCell(i,1,v,3)).join('')}</row>`,r=2;for(const d of DAYS)for(const x of classes(s,d)){dataRows+=`<row r="${r}" ht="${Math.min(110,Math.max(25,Math.ceil(x.name.length/42)*16+8))}" customHeight="1">${stringCell(0,r,d,4)}${stringCell(1,r,x.name,4)}${numberCell(2,r,minutes(x.start)/1440,5)}${numberCell(3,r,minutes(x.end)/1440,5)}${numberCell(4,r,minutes(x.end)-minutes(x.start),6,`ROUND((D${r}-C${r})*1440,0)`)}</row>`;r++}

function wrapText(ctx,text,width){const lines=[];let line='';for(const word of text.split(/\s+/)){let next=line?line+' '+word:word;if(ctx.measureText(next).width<=width){line=next;continue}if(line){lines.push(line);line=''}for(const ch of word){if(ctx.measureText(line+ch).width>width&&line){lines.push(line);line=''}line+=ch}}if(line)lines.push(line);return lines.length?lines:['']}
async function exportPNG(){const s=structuredClone(current()),ds=exportDays(s),theme=THEMES.find(t=>t.id===state.settings.theme),accent=state.settings.accent||theme.accent;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)throw Error('Image export is not supported in this browser.');await document.fonts.ready;const colWidth=230,pad=34,width=pad*2+ds.length*colWidth,gap=10;ctx.font='600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';const columns=ds.map(d=>classes(s,d).map(x=>({...x,lines:wrapText(ctx,x.name,colWidth-gap-28)})));const heights=columns.map(list=>list.reduce((n,x)=>n+Math.max(72,x.lines.length*23+43)+gap,0));ctx.font='700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';const titleLines=wrapText(ctx,s.name,width-pad*2),headerHeight=92+titleLines.length*36,height=headerHeight+Math.max(130,...heights)+54;if(height>14500)throw Error('This schedule is too large for one picture. Use the Excel export instead.');const scale=Math.min(2,Math.sqrt(24000000/(width*height)));canvas.width=Math.floor(width*scale);canvas.height=Math.floor(height*scale);ctx.scale(scale,scale);ctx.fillStyle=theme.bg;ctx.fillRect(0,0,width,height);ctx.fillStyle=theme.muted;ctx.font='600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText('SCHOOL UP  /  WEEKLY TIMETABLE',pad,32);ctx.fillStyle=accent;ctx.font='700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';titleLines.forEach((line,i)=>ctx.fillText(line,pad,70+i*36));const rounded=(x,y,w,h,r,fill)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()};ds.forEach((d,c)=>{const x=pad+c*colWidth;ctx.fillStyle=theme.text;ctx.font='600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(d,x+2,headerHeight-18);let y=headerHeight;for(const item of columns[c]){const h=Math.max(72,item.lines.length*23+43);rounded(x,y,colWidth-gap,h,12,theme.surface);rounded(x,y+14,3,h-28,2,accent);ctx.fillStyle=theme.text;ctx.font='600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';item.lines.forEach((line,i)=>ctx.fillText(line,x+14,y+27+i*23));ctx.fillStyle=theme.muted;ctx.font='14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(item.start+' – '+item.end,x+14,y+h-15);y+=h+gap}if(!columns[c].length){ctx.fillStyle=theme.muted;ctx.font='14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText('No classes',x+2,y+28)}});ctx.fillStyle=theme.muted;ctx.font='12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(countClasses(s)+' subjects · '+s.name,pad,height-20,width-pad*2);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('Could not create the picture. Try the Excel export.');download(blob,filename(s)+'.png');toast('Timetable picture downloaded')}
$('schedule-switch').onclick=()=>{renderSchedules();openDialog('schedules')};$('settings-open').onclick=()=>{renderSettings();openDialog('settings')};$('add-subject').onclick=()=>openEditor();$('subject-form').onsubmit=saveSubject;$('import-file').onchange=importFile;$('new-schedule').onclick=()=>openName();$('today-button').onclick=()=>{selectedDay=today();if(DAYS.indexOf(selectedDay)>4)state.settings.weekends=true;state.settings.view='list';persist();render()};

state.schedules.length<=1)return;state.schedules=state.schedules.filter(x=>x.id!==s.id);if(state.activeId===s.id)state.activeId=state.schedules[0].id;persist();render();renderSchedules();toast('Schedule deleted')})}if(d.exportAction){(async()=>{b.disabled=true;try{if(d.exportAction==='json')exportJSON();if(d.exportAction==='backup')exportJSON(true);if(d.exportAction==='import')$('import-file').click();if(d.exportAction==='xlsx'){download(makeWorkbook(current()),filename()+'.xlsx');toast('Excel workbook downloaded')}if(d.exportAction==='png')await exportPNG()}catch(err){toast(err.message||'Export failed. Please try again.')}finally{b.disabled=false}})()}});
